name = "tatit2-booking"
main = "src/index.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[vars]
FROM_EMAIL = "tat.it.too bookings <bookings@tatit2.com>"
SITE_URL = "https://www.tatit2.com"
ALLOWED_ORIGINS = "https://www.tatit2.com,https://tatit2.com"

# Per-address request limit, enforced in src/index.js.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secrets, set with `npx wrangler secret put <NAME>`:
#   RESEND_API_KEY     Resend API key (sending access only)
#   TO_EMAIL           inbox that receives booking requests
#   RECAPTCHA_SECRET   reCAPTCHA v2 secret key. When set, every request must pass, and the
#                      customer gets a confirmation email. Without it neither happens.
